# This workflow will build a Java project with Maven

name: Java CI with Maven

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & Push docker image
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_PWD: ${{ secrets.DOCKERHUB_PWD }}
        run: mvn -B spring-boot:build-image -DskipTests

      # Login to cluster

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Authenticate and set context
        uses: redhat-actions/oc-login@v2
        env:
          OPENSHIFT_NAMESPACE: suramsatish-dev
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      # Apply manifest files

      - name: Deploy
        run: |
          oc apply -f k8s/service.yml
          oc apply -f k8s/config.yml
          oc apply -f k8s/deployment.yml
          oc rollout status deployment/ratingservice
