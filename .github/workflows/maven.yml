# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Check Docker Hub username
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        run: |
          if [ "$DOCKERHUB_USER" = "ssuram1" ]; then
            echo "Docker Hub username is correct"
          else
            echo "Docker Hub username is NOT ssuram1"
          fi

      - name: Build Movie Service Docker image
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        working-directory: movie-service/movie-service
        run: |
          mvn -B spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName=${DOCKERHUB_USER}/movie-service:latest

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_PWD: ${{ secrets.DOCKERHUB_PWD }}
        run: |
          echo "$DOCKERHUB_PWD" | docker login -u "$DOCKERHUB_USER" --password-stdin

      - name: Push Movie Service image
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        run: |
          docker push ${DOCKERHUB_USER}/movie-service:latest
